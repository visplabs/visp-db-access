replicaCount: 2
image:
  repository: ghcr.io/visplabs/visp-gate
  tag: '0.1.0'
  pullPolicy: IfNotPresent
existingSecret: visp-gate-secrets
# Required keys: database-url, master-key. Optional bootstrap keys below.
bootstrapAdmin: false
serviceAccount:
  create: true
  name: ''
  annotations: {}
  # For EKS IRSA, annotate the account with eks.amazonaws.com/role-arn.
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/visp-gate
config:
  cookieSecure: true
  allowedCidrs: ''
  trustProxyHeaders: false
  trustedProxyCidrs: ''
  allowPrivateTargets: false
  metadataPoolSize: 20
  # The address people open the console at, such as https://gate.example.com.
  # Notices to approvers link to a request only when it is set.
  publicUrl: ''
  # Days the record of agent steps (tool, task, SQL text; never rows) is kept.
  agentStepsRetentionDays: 30
  # Memory that one pod may use for rows it holds for the agent tool
  # fetch_rows: for all agents together, and for one agent. Both are in
  # bytes as a whole number; a value such as "256Mi" does not work. 0 holds
  # nothing. The default of heldResultsMaxBytes (256 MiB) is half of the
  # chart's default memory limit (512Mi): raise the memory limit, or lower
  # this value, for agents that page large results.
  heldResultsMaxBytes: 268435456
  heldResultsAgentMaxBytes: 67108864
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: '2', memory: 512Mi}
service:
  port: 8080
ingress:
  enabled: false
  className: nginx
  host: db-access.example.com
  annotations: {}
  tlsSecretName: visp-gate-tls
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
podDisruptionBudget:
  enabled: true
  minAvailable: 1
