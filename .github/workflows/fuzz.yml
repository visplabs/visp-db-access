name: Fuzz
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb # nightly
        with: {toolchain: nightly}
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with: {tool: cargo-fuzz}
      # The guard must never panic, must be deterministic, and must never
      # return SQL to run for a statement it denied.
      - run: cargo +nightly fuzz run analyze -- -max_total_time=600 -max_len=4096
        working-directory: crates/vda-guard
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: fuzz-artifacts, path: crates/vda-guard/fuzz/artifacts, retention-days: 30}
