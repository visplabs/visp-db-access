name: CI
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ['', '--features fake-discovery']
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: vda, POSTGRES_PASSWORD: test-password, POSTGRES_DB: vda}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U vda -d vda" --health-interval 5s --health-timeout 3s --health-retries 20
      mysql:
        image: mysql:8.4
        env: {MYSQL_ROOT_PASSWORD: test-password, MYSQL_DATABASE: vda, MYSQL_USER: vda, MYSQL_PASSWORD: test-password}
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -h localhost -ptest-password" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CARGO_TARGET_DIR: target-server
      VISP_GATE_TEST_DATABASE_URL: postgres://vda:test-password@localhost:5432/vda
      VISP_GATE_TEST_POSTGRES_URL: postgres://vda:test-password@localhost:5432/vda
      VISP_GATE_TEST_PG_URL: postgres://vda:test-password@localhost:5432/vda
      VISP_GATE_TEST_MYSQL_URL: mysql://vda:test-password@localhost:3306/vda
      VISP_GATE_TEST_PG_PASSWORD: test-password
      VISP_GATE_TEST_MYSQL_PASSWORD: test-password
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {components: 'rustfmt, clippy'}
      - uses: Swatinem/rust-cache@v2
        with: {cache-directories: target-server}
      - run: cargo fmt --all -- --check
      # The session-reset test creates a role and a stored function. The image's
      # application account may do neither, and binary logging refuses function
      # creation without log_bin_trust_function_creators.
      - name: Let the MySQL test account create roles and functions
        env: {MYSQL_PWD: test-password}
        run: |
          mysql --protocol=tcp -h 127.0.0.1 -uroot -e "SET GLOBAL log_bin_trust_function_creators = 1; GRANT CREATE ROLE, DROP ROLE, ROLE_ADMIN ON *.* TO 'vda'@'%'; GRANT SELECT ON performance_schema.* TO 'vda'@'%'"
      - run: cargo clippy --workspace --all-targets ${{ matrix.features }} -- -D warnings
      - run: cargo test --workspace ${{ matrix.features }}
      - name: Build fake-provider gateway
        if: matrix.features != ''
        run: cargo build -p vda-server --features fake-discovery
      - name: Fake-provider API smoke
        if: matrix.features != ''
        env:
          PGPASSWORD: test-password
          VISP_GATE_DATABASE_URL: postgres://vda:test-password@localhost:5432/vda
          VISP_GATE_BIND: 127.0.0.1:8080
          VISP_GATE_COOKIE_SECURE: 'false'
          VISP_GATE_ALLOW_PRIVATE_TARGETS: 'true'
          VISP_GATE_BOOTSTRAP_ADMIN_EMAIL: admin@local.test
          VISP_GATE_BOOTSTRAP_ADMIN_PASSWORD: local-admin-password
          VISP_GATE_DISCOVERY_FAKE_FIXTURE: /tmp/vda-rds-discovery.json
          VISP_GATE_SMOKE_TARGET_PORT: '5432'
        run: |
          psql -h localhost -U vda -d vda -v ON_ERROR_STOP=1 -c 'CREATE DATABASE shop'
          psql -h localhost -U vda -d shop -v ON_ERROR_STOP=1 -f deploy/demo/postgres.sql
          psql -h localhost -U vda -d shop -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE shop_reader LOGIN PASSWORD 'shop_reader_pw';
          CREATE ROLE shop_writer LOGIN PASSWORD 'shop_writer_pw';
          GRANT CONNECT ON DATABASE shop TO shop_reader, shop_writer;
          GRANT USAGE ON SCHEMA public TO shop_reader, shop_writer;
          GRANT SELECT ON ALL TABLES IN SCHEMA public TO shop_reader;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO shop_writer;
          SQL
          jq '(.resources[] | select(.identifier == "local-shop-aurora") | .port) = 5432' scripts/fixtures/rds-discovery.json > "$VISP_GATE_DISCOVERY_FAKE_FIXTURE"
          VISP_GATE_MASTER_KEY="$(target-server/debug/visp-gate gen-key)"
          export VISP_GATE_MASTER_KEY
          target-server/debug/visp-gate serve > /tmp/vda-smoke-server.log 2>&1 &
          gateway_pid=$!
          trap 'kill "$gateway_pid" 2>/dev/null || true; wait "$gateway_pid" 2>/dev/null || true' EXIT
          ready=false
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/readyz > /dev/null; then ready=true; break; fi
            if ! kill -0 "$gateway_pid" 2>/dev/null; then cat /tmp/vda-smoke-server.log; exit 1; fi
            sleep 1
          done
          if [[ $ready != true ]]; then cat /tmp/vda-smoke-server.log; exit 1; fi
          bash scripts/e2e-smoke.sh
          # The demo walkthrough (docs/DEMO.md) against the same gateway: a
          # scripted agent at the agent door. It fails when the gate does
          # not behave as the demo says.
          psql -h localhost -U vda -d shop -v ON_ERROR_STOP=1 -f deploy/demo/postgres-gate.sql
          VISP_GATE_DEMO_ADMIN_EMAIL="$VISP_GATE_BOOTSTRAP_ADMIN_EMAIL" VISP_GATE_DEMO_ADMIN_PASSWORD="$VISP_GATE_BOOTSTRAP_ADMIN_PASSWORD" \
            VISP_GATE_DEMO_REVIEWER_PASSWORD=local-reviewer-password VISP_GATE_DEMO_TARGET_HOST=127.0.0.1 \
            VISP_GATE_DEMO_TARGET_PASSWORD=demo-local-only VISP_GATE_DEMO_TOKEN_FILE=/tmp/vda-demo-agent-token \
            bash scripts/demo-seed.sh
          VISP_GATE_AGENT_TOKEN_FILE=/tmp/vda-demo-agent-token bash scripts/demo-agent.sh
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run format:check
        working-directory: web
      # Packages that ship in the console must have no known vulnerability;
      # build and test tooling may not carry a high or critical one. The only
      # exceptions for tooling, each with a reason and a date, live in
      # web/scripts/audit-dev.mjs; it fails on anything else and on a stale one.
      - run: npm audit --omit=dev
        working-directory: web
      - run: npm run audit:dev
        working-directory: web
      - run: npm test
        working-directory: web
      # Browser tests run against the in-memory mock API (playwright.config.ts
      # starts `npm run dev:mock`), so they need no server or database. The
      # binary is the version `npm ci` installed from the lockfile; nothing is
      # fetched on demand.
      - run: ./node_modules/.bin/playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
        timeout-minutes: 15
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: playwright-results, path: web/test-results, retention-days: 7, if-no-files-found: ignore}
  # Known vulnerabilities, licenses and crate sources (deny.toml).
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with: {command: check}
  # Linters for the files no compiler reads, and a scan for committed secrets.
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Workflow files (actionlint)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      # Each linter runs even when an earlier one fails, so one run shows all.
      - name: Dockerfile (hadolint)
        if: ${{ !cancelled() }}
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with: {dockerfile: Dockerfile, failure-threshold: warning}
      - name: Shell scripts (shellcheck)
        if: ${{ !cancelled() }}
        run: shellcheck scripts/*.sh
      - name: Committed secrets (gitleaks)
        if: ${{ !cancelled() }}
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 git /repo --redact --no-banner
  # Line coverage of the Rust workspace, with the same databases as the rust
  # job so the live tests count.
  coverage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: vda, POSTGRES_PASSWORD: test-password, POSTGRES_DB: vda}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U vda -d vda" --health-interval 5s --health-timeout 3s --health-retries 20
      mysql:
        image: mysql:8.4
        env: {MYSQL_ROOT_PASSWORD: test-password, MYSQL_DATABASE: vda, MYSQL_USER: vda, MYSQL_PASSWORD: test-password}
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -h localhost -ptest-password" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      VISP_GATE_TEST_DATABASE_URL: postgres://vda:test-password@localhost:5432/vda
      VISP_GATE_TEST_POSTGRES_URL: postgres://vda:test-password@localhost:5432/vda
      VISP_GATE_TEST_PG_URL: postgres://vda:test-password@localhost:5432/vda
      VISP_GATE_TEST_MYSQL_URL: mysql://vda:test-password@localhost:3306/vda
      VISP_GATE_TEST_PG_PASSWORD: test-password
      VISP_GATE_TEST_MYSQL_PASSWORD: test-password
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with: {toolchain: stable, components: llvm-tools-preview}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with: {tool: cargo-llvm-cov}
      # The session-reset test creates a role and a stored function. The image's
      # application account may do neither, and binary logging refuses function
      # creation without log_bin_trust_function_creators.
      - name: Let the MySQL test account create roles and functions
        env: {MYSQL_PWD: test-password}
        run: |
          mysql --protocol=tcp -h 127.0.0.1 -uroot -e "SET GLOBAL log_bin_trust_function_creators = 1; GRANT CREATE ROLE, DROP ROLE, ROLE_ADMIN ON *.* TO 'vda'@'%'; GRANT SELECT ON performance_schema.* TO 'vda'@'%'"
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - run: cargo llvm-cov report --summary-only
      - uses: actions/upload-artifact@v4
        with: {name: rust-coverage, path: lcov.info, retention-days: 14}
