# cargo-deny: known vulnerabilities, licenses and crate sources.
# Run locally with `cargo deny check`.

[graph]
all-features = true
# Test-only crates never ship in the gateway binary.
exclude-dev = true

[advisories]
# Each entry needs a reason and is reviewed when its dependency releases a fix.
ignore = [
    # rsa: timing side channel in private-key operations (no fixed release).
    # Pulled by sqlx-mysql, which only uses RSA *public-key* encryption of the
    # password for caching_sha2 logins over a non-TLS connection.
    { id = "RUSTSEC-2023-0071", reason = "no fixed release; sqlx-mysql uses public-key encryption only" },
    # pin-utils is unmaintained, not vulnerable; pulled by the AWS SDK.
    { id = "RUSTSEC-2026-0441", reason = "unmaintained only; transitive through the AWS SDK" },
]

[licenses]
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "0BSD",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
